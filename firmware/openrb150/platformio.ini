; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; The target hardware is a ROBOTIS OpenRB-150 (Microchip SAMD21G18A,
; Cortex-M0+ @ 48 MHz, 256 KB flash, 32 KB SRAM). PlatformIO ships no
; OpenRB-150 board package, so this project provides one:
;
;   boards/openrb150.json          -> custom board definition ([env:openrb150])
;   variants/OpenRB-150/variant.*  -> exact OpenRB-150 pin map (from ROBOTIS)
;
; The custom variant restores the OpenRB-150 peripheral mapping that the stock
; `mkrzero` board gets wrong. With [env:openrb150] you get the REAL hardware
; mapping:
;   - Serial1 -> internal DYNAMIXEL TTL bus (SERCOM2, pins 26/27)
;   - Serial2 -> external 4-pin UART connector (SERCOM4, pins 28/29)
;   - Serial3 -> expansion UART header (SERCOM5, D14 TX / D13 RX)  [CRSF/ELRS]
;   - BDPIN_DXL_PWR_EN (31) -> DYNAMIXEL power FET enable
;   - PIN_LED / LED_BUILTIN (32), ADC_BATTERY (33)
;
; Use [env:openrb150] for all firmware work. See
; doc/mkrzero-vs-openrb150.md for the full rationale.

[platformio]
default_envs = openrb150

[env]
monitor_speed = 115200

; Shared firmware settings for the on-target (SAMD21) environments. The native
; test env deliberately does NOT extend this so it stays toolchain-independent.
[fw_base]
platform = atmelsam
framework = arduino
monitor_speed = 115200
lib_deps =
    robotis-git/Dynamixel2Arduino@^0.8.1
    briscoetech/FreeRTOS_SAMD21@^2.3.0
    https://github.com/sparkfun/SparkFun_Qwiic_OLED_Arduino_Library.git#v1.0.13

; Primary environment: custom OpenRB-150 board + variant (correct pin mapping).
[env:openrb150]
extends = fw_base
board = openrb150
board_build.variants_dir = variants
; HIL battery calibration (2e8 bring-up): meter read 12.00 V on the pack while
; firmware (default 4.0 ratio) reported ~9148 mV -> pin ~2287 mV, so the real
; divider ratio is 12000 / 2287 = 5.25. See board.h calibration notes.
build_flags =
    -D HEXAPOD_BATTERY_DIVIDER_RATIO=5.25f
    -D HEXAPOD_FORCE_CUSTOM_CHANNELPACK
    -include src/app/freertos_config.h
    ; Define HEXAPOD_ENABLE_SERIAL2 only when the external four-pin UART is
    ; part of this deployment; omitting it releases the unused UART buffers.
    -Wl,--wrap=vApplicationStackOverflowHook
    -Wl,--wrap=vApplicationMallocFailedHook

; Explicit HIL target: the output guard is compiled into the board and DXL
; write boundaries. It can never be enabled through USB at runtime.
[env:openrb150_hil_output_disabled]
extends = fw_base
board = openrb150
board_build.variants_dir = variants
build_flags =
    -D HEXAPOD_BATTERY_DIVIDER_RATIO=5.25f
    -D HEXAPOD_FORCE_CUSTOM_CHANNELPACK
    -D HEXAPOD_HIL_OUTPUT_DISABLED
    -include src/app/freertos_config.h
    -Wl,--wrap=vApplicationStackOverflowHook
    -Wl,--wrap=vApplicationMallocFailedHook

; Diagnostic image: the FULL application firmware with only the debug OLED
; compiled out (no SparkFun object/framebuffer). OpenLog storage, capture, and
; event persistence remain active. Used to A/B whether the OLED's SRAM
; footprint contributes to an overflow: flash this and compare stack
; high-water marks / crash behavior against [env:openrb150].
[env:openrb150_no_oled]
extends = fw_base
board = openrb150
board_build.variants_dir = variants
build_flags =
    -D HEXAPOD_BATTERY_DIVIDER_RATIO=5.25f
    -D HEXAPOD_FORCE_CUSTOM_CHANNELPACK
    -D HEXAPOD_NO_DEBUG_OLED
    -include src/app/freertos_config.h
    -Wl,--wrap=vApplicationStackOverflowHook
    -Wl,--wrap=vApplicationMallocFailedHook

; Minimal diagnostic image: safe board init + retained fault print over USB.
; Excludes all RTOS tasks, I2C, OLED, OpenLog, DXL, RC, and API application code.
[env:openrb150_crash_recovery]
extends = fw_base
board = openrb150
board_build.variants_dir = variants
build_flags =
    -D HEXAPOD_CRASH_RECOVERY_BOOT
    -include src/app/freertos_config.h
    -Wl,--wrap=vApplicationStackOverflowHook
    -Wl,--wrap=vApplicationMallocFailedHook
build_src_filter =
    -<*>
    +<recovery_main.cpp>
    +<board/board.cpp>
    +<board/battery_calc.cpp>
    +<hil/output_guard.cpp>
    +<safety/fault_capture.cpp>
    +<safety/watchdog.cpp>

; Minimal storage diagnostic: retained crash -> EVENTS.LOG, PROBE.LOG append,
; then CONFIG.TXT bootstrap/readback. No scheduler, OLED, DXL, RC, or sensors.
[env:openrb150_storage_recovery]
extends = fw_base
board = openrb150
board_build.variants_dir = variants
build_flags =
    -D HEXAPOD_STORAGE_RECOVERY_BOOT
    -include src/app/freertos_config.h
    -Wl,--wrap=vApplicationStackOverflowHook
    -Wl,--wrap=vApplicationMallocFailedHook
build_src_filter =
    -<*>
    +<storage_recovery_main.cpp>
    +<board/board.cpp>
    +<board/battery_calc.cpp>
    +<hil/output_guard.cpp>
    +<safety/fault_capture.cpp>
    +<safety/event_log.cpp>
    +<safety/error_journal.cpp>
    +<sensors/i2c_bus.cpp>
    +<sensors/i2c_topology.cpp>
    +<config/qwiic_openlog.cpp>
    +<config/config_store.cpp>
    +<config/config_schema.cpp>
    +<config/config_bootstrap.cpp>
    +<protocol/crc16.cpp>

; Native (host) unit tests for the portable layers. Keep this source policy in
; sync with CMakeLists.txt: include all src/ code except the explicit owners of
; Arduino entry, FreeRTOS task scheduling, GPIO/Serial/Wire/DXL I/O, and the
; physical EEPROM driver. New portable ControllerCore sources are then picked
; up automatically by both native build paths.
; Run with: pio test -e native
[env:native]
platform = native
build_src_filter =
    +<*>
    -<main.cpp>
    -<app/tasks.cpp>
    -<board/board.cpp>
    -<config/qwiic_openlog.cpp>
    -<dxl/dxl_bus.cpp>
    -<sensors/bno085.cpp>
    -<sensors/finger_sensor.cpp>
    -<sensors/i2c_bus.cpp>
    -<sensors/qwiic_debug_oled.cpp>
; The controller bridge decodes the vendored ChannelPack wire layout; expose its
; header to both the bridge source and the native tests.
build_flags = -I lib/ChannelPack
test_framework = unity
test_build_src = true